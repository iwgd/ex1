<!doctype html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Festa do Pato 2030 — Candidaturas</title>
        <link rel="stylesheet" href="styles/styles.css" />
    </head>
    <body>
        <header class="cabecalho">
            <a href="index.html" class="logo-link">
                <img
                    src="images/logo.png"
                    alt="Logo da Festa do Pato"
                    height="100"
                />
            </a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="candidatura.html" class="active">Candidaturas</a>
                <a href="flyer.html">Flyer</a>
            </nav>
            <a href="bilhetes.html" class="botao-cta">Comprar Bilhete</a>
        </header>

        <main>
            <div class="contentor-candidatura">
                <h1 class="titulo-candidatura">Candidatura</h1>

                <form class="formulario-candidatura" action="./candidaturaAceite.html" method="post">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" required />

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required />

                    <label for="comentario">Comentário (opcional):</label>
                    <textarea id="comentario" name="comentario" rows="4"></textarea>

                    <button type="submit" class="botao-comprar" id="submit-btn">Enviar Candidatura</button>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2030 Festa do Pato. Todos os direitos reservados.</p>
        </footer>

        <script src="scripts/candidatura.js"></script>
    </body>
</html>
